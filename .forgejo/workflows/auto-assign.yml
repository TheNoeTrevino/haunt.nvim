name: Auto Assign

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Assign the maintainer
        env:
          NUMBER: ${{ forgejo.event.issue.number || forgejo.event.pull_request.number }}
          OPENER: ${{ forgejo.event.sender.login }}
          MAINTAINER: noe.trevino
        run: |
          if [ "$OPENER" = "$MAINTAINER" ]; then
            echo "Skipping auto-assign: opened by $MAINTAINER"
            exit 0
          fi

          call() {
            body=$(mktemp)
            status=$(curl -sS -o "$body" -w '%{http_code}' -X "$1" \
              "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/$2" \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$3")
            echo "$1 $2 -> $status"
            cat "$body"; echo
            [ "$status" -lt 300 ] || exit 1
          }

          call PATCH "issues/$NUMBER" "{\"assignees\":[\"$MAINTAINER\"]}"

          case "$FORGEJO_EVENT_NAME" in
            pull_request*)
              call POST "pulls/$NUMBER/requested_reviewers" "{\"reviewers\":[\"$MAINTAINER\"]}"
              ;;
          esac
